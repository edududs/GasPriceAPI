{% if vehicles %}
  <ul class="max-h-64 divide-y divide-stone-100 overflow-y-auto rounded-lg border border-stone-200 text-sm dark:divide-stone-800 dark:border-stone-800">
    {% for vehicle in vehicles %}
      <li>
        <button type="button" data-vehicle-id="{{ vehicle.id }}" data-vehicle-name="{{ vehicle.name }}"
                data-vehicle-detail="{% for fuel, efficiency in vehicle.efficiencies.items %}{{ fuel.label }}: {{ efficiency.city }}/{{ efficiency.highway }} km/L{% if not forloop.last %} · {% endif %}{% endfor %}"
                class="w-full px-3 py-2 text-left hover:bg-stone-50 dark:hover:bg-stone-800">
          <span class="font-medium">{{ vehicle.name }}</span>
          <span class="block text-xs text-stone-500 dark:text-stone-400">
            {% for fuel, efficiency in vehicle.efficiencies.items %}{{ fuel.label }} {{ efficiency.city }}/{{ efficiency.highway }}{% if not forloop.last %} · {% endif %}{% endfor %} km/L (cidade/estrada)
          </span>
        </button>
      </li>
    {% endfor %}
  </ul>
{% elif query %}
  <p class="text-sm text-stone-500 dark:text-stone-400">Nada encontrado para “{{ query }}”. Tente só o modelo, ou informe o km/L.</p>
{% else %}
  <p class="text-sm text-stone-500 dark:text-stone-400">O catálogo está vazio. Rode <code>manage.py import_vehicles</code> ou informe o km/L.</p>
{% endif %}
